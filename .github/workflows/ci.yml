name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate config.example.yaml
        run: |
          python -c "from voxrouter.config import load_config; load_config('config.example.yaml'); print('config ok')"

      - name: Pytest
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t voxrouter:ci .

      - name: Smoke /health
        run: |
          printf '%s\n' \
            'providers:' \
            '  mock:' \
            '    type: mock' \
            '  edge:' \
            '    type: edge' \
            '    options: {voice: pt-BR-AntonioNeural}' \
            'models:' \
            '  auto:' \
            '    providers: [mock, edge]' \
            'cache: {enabled: false}' \
            'host: 0.0.0.0' \
            'port: 8000' > config.yaml
          docker run -d --name vox -p 8000:8000 \
            -v "$PWD/config.yaml:/app/config.yaml:ro" \
            voxrouter:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null; then
              echo "health ok"
              curl -sf http://127.0.0.1:8000/v1/models | head -c 200
              docker rm -f vox
              exit 0
            fi
            sleep 1
          done
          docker logs vox || true
          docker rm -f vox || true
          exit 1
